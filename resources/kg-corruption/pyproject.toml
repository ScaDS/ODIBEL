[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-corrupt"
version = "1.0.0"
description = "Controlled omission-only corruption benchmark for source-aligned reference knowledge graphs."
requires-python = ">=3.10"
dependencies = [
    "rdflib>=6.0.0",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
kg-corrupt = "kg_corrupt.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
