# Example configuration for the controlled KG corruption benchmark.
# Relative paths resolve against this file's directory.

input:
  root_reference: ../data/example/root_reference.ttl
  format: turtle

output:
  directory: ../outputs/example-corruptions
  serialization: nt
  write_removed_triples: true
  write_retained_triples: false

benchmark:
  # Use small defaults here so the example is cheap to run.
  # Paper-scale runs typically use 20 seeds and the eight fractions below.
  global_seed: 0
  nested: false
  seeds: [1, 2, 3]
  removal_fractions: [0.10, 0.30, 0.50]
  # removal_fractions: [0.05, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70]

eligibility:
  protected_predicates:
    - "http://www.w3.org/2000/01/rdf-schema#label"
  protected_namespaces: []
  protect_schema_triples: true
  protect_blank_node_scaffolding: false
  allow_blank_seed_entities: false

families:
  random_fact:
    enabled: true

  entity:
    enabled: true
    mode: incident          # incident | subject
    entity_sampling: uniform

  predicate:
    enabled: true
    mode: whole_predicates  # whole_predicates | within_predicates
    predicate_sampling: uniform  # uniform | frequency | inverse_frequency

  long_tail:
    enabled: true
    basis: predicate_frequency  # predicate_frequency | subject_frequency | entity_frequency | combined
    alpha: 1.0

  source:
    enabled: true
    provenance_file: ../data/example/provenance.jsonl
    multi_source_policy: remove_if_all_selected  # remove_if_all_selected | remove_if_any_selected
    named_graph_as_source: true

  subgraph:
    enabled: true
    traversal: undirected   # undirected | directed
    max_hops: 2
    include_literal_properties: true
    seed_entity_sampling: uniform
    # max_cluster_fraction: 0.10
