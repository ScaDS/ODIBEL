    uv run python generate_politics.py
  started_at: "2026-11-26T18:15:43Z"
  finished_at: "2026-11-26T18:16:00Z"
  environment:
    python: "CPython 3.12.11 (uv)"
    pyspark: "4.1.2"
    java: "OpenJDK 17.0.15 (Temurin)"
    spark_master: "local[*]"
  validation: >-
    uv run resources/dbpedia-multi-source-kg/validate_run.py <this dir> <input data.nt.bz2>
    <dbo-snapshots.ttl> resources/dbpedia-multi-source-kg/generate_politics.py > .odibel/stats.json
files:
  dbpedia_politics_subgraph/: all literals
  dbpedia_politics_en_subgraph/: only @en and untagged literals (identical here, the input is English-only)
  "*/selected.nt.bz2": triples whose subject has one of the 12 politics classes
  "*/distinct.nt.bz2": duplicates removed
  "*/consistent.nt.bz2": rdfs:domain / rdfs:range violations removed
  "*/cleaned_types.nt.bz2": rdf:type restricted to the politics classes
  "*/cleaned_subgraph.nt.bz2": IRI objects that are not subjects removed (final graph)
  "*/schema_graph_*.csv": schema graphs (all, final, final top 100)
contract:
  format: Spark text part directories with N-Triples lines; the *.nt.bz2 names are not bzip2 files
  identity: >-
    Part-file names are random per run, so files.sha256 changes on rerun; content_sha256 in
    stats.json (sorted triples per step) is stable and matched a second run.
limitations:
  - "clean_domain_range_violations removes valid triples: 4,713 of 5,186 removals are false positives. See report.md."
  - "owl:disjointWith and owl:FunctionalProperty are not checked by the pipeline."
  - "The English-only input makes the _en variant identical to the unfiltered one; the language filter is not exercised."
used_by:
