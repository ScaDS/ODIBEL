    cd resources/dbpedia-multi-source-kg &&
    INPUT_PATH=data/dbpedia-2022.12.01-mini-food-celestial-politics-en-s42/data.nt.bz2
    OUTPUT_PATH=data/dbpedia-2022.12.01-multisource-politics-mini-en-s42
